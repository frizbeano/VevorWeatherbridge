      <line x1="150" y1="0" x2="118" y2="0"/>
      <line x1="106" y1="106" x2="83" y2="83"/>
      <line x1="-106" y1="-106" x2="-83" y2="-83"/>
      <line x1="-150" y1="0" x2="-118" y2="0"/>
    </g>
    <circle r="92" fill="url(#sun)"/>
  </g>
  <!-- cloud -->
  <g fill="url(#cloud)" stroke="#ffffff" stroke-width="0">
    <path d="M118 372
             a78 78 0 0 1 8 -155
             a112 112 0 0 1 206 -22
