name: Release

# Push a tag like v1.2.3 to publish a release. The tag must match the manifest
# version, and CHANGELOG.md must have a "## 1.2.3" section, which becomes the
# release notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check versions match
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(jq -r .version custom_components/vevor_weatherbridge/manifest.json)
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag v$tag does not match manifest version $manifest"
            exit 1
          fi
          awk -v v="$tag" '$0 == "## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $tag' section"
            exit 1
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
